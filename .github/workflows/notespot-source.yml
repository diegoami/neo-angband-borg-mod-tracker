# FORK: explicit exact-source compatibility gate, separate from published beta.3 CI.
name: notespot-source
on: {"workflow_call":{},"workflow_dispatch":{}}
jobs:
  exact-source:
    if: github.repository == 'diegoami/neo-angband-borg-mod-tracker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: diegoami/neo-angband-tracker
          ref: f576b099b18e0016e0827e43a5770a369f53e279
          path: engine-source
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
      - run: npm install --global npm@11.20.0
      - run: bash tools/build-notespot-artifacts.sh engine-source "$RUNNER_TEMP/engine-artifacts"
      - run: node tools/verify-notespot-source.mjs "$RUNNER_TEMP/engine-artifacts/tarballs"
