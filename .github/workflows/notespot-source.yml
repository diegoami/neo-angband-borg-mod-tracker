# FORK: RAW official06a compatibility, separate from unchanged published beta.3 default.
name: notespot-source
on: {"workflow_call":{},"workflow_dispatch":{}}
jobs:
  exact-source:
    if: github.repository == 'diegoami/neo-angband-borg-mod-tracker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: neostryder/neo-angband
          ref: 06a2321ce30a414df20d1b20d486446e7688171c
          path: engine-source
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
      - run: bash tools/build-notespot-artifacts.sh engine-source "$RUNNER_TEMP/engine-artifacts"
      - run: node tools/verify-notespot-source.mjs "$RUNNER_TEMP/engine-artifacts/tarballs"
