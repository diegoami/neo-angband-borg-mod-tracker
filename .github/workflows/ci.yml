# FORK: one automatic workflow per PR update, plus default-master verification.
name: ci
on: {"push":{"branches":["master"]},"pull_request":{},"workflow_dispatch":{}}
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  profile:
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.route.outputs.profile }}
      full: ${{ steps.route.outputs.full }}
      source: ${{ steps.route.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: route
        run: node tools/ci-profile.mjs
  checks:
    needs: profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      # Default remains the unchanged, unpatched published beta.3 tuple.
      - run: pnpm install --frozen-lockfile
      - run: node tools/check-session.mjs
      - if: ${{ hashFiles('tools/c-bugs.mjs') != '' }}
        run: node tools/c-bugs.mjs --check
      - if: ${{ hashFiles('tools/c-bugs-source.test.mjs') != '' }}
        run: node --test tools/c-bugs-source.test.mjs
      - run: node --test tools/ci-profile-checks.mjs
      - run: node tools/check-grants.mjs
      # These are real documentation contracts, including settings-table and changelog data.
      - if: needs.profile.outputs.full != 'true'
        run: pnpm exec vitest run docs-sync.test.ts version-sync.test.ts
      - if: needs.profile.outputs.full == 'true'
        env:
          CI: '1'
          NO_COLOR: '1'
        shell: bash
        run: |
          set -o pipefail
          pnpm verify | tee "$RUNNER_TEMP/port-verify.log"
          node tools/ci-profile.mjs --verify-log "$RUNNER_TEMP/port-verify.log"
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: neostryder/neo-angband/.github/actions/private-scan@master
  exact-source:
    needs: profile
    if: needs.profile.outputs.source == 'true'
    uses: ./.github/workflows/notespot-source.yml
  # Stable required result; a failed classifier/privacy/required source job cannot look green.
  verify:
    if: always()
    needs: [profile, checks, scan, exact-source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node tools/ci-profile.mjs --gate
